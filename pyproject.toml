[project]
name = "churn-api"
version = "0.1.0"
description = "Telco Churn Prediction API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "scikit-learn==1.9.1",
    "pandas",
    "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.fastapi]
entrypoint = "api.main:app"               